packages:
  - apps/*
  - packages/*
  - tools/*

catalog:
  "@clack/prompts": ^1.3.0
  "@types/node": ^24
  dotenv: ^17.4.2
  picocolors: ^1.1.1
  simple-git: ^3.36.0
  tsx: ^4.21.0
  typescript: ^5
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vite-plus: latest
  vitest: npm:@voidzero-dev/vite-plus-test@latest
  xdg-basedir: ^5.1.0

catalogMode: prefer
overrides:
  vite: "catalog:"
  vitest: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
